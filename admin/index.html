<!doctype html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Вход</title>
	<link rel="stylesheet" href="styles/index.css">

</head>
<body class="body-auth">
	<main class="main-auth">
		<section class="main-form">
			<h1 class="main-header">Введите Имя и Пароль</h1>
			<form id="admin-login-form">

				<label class="label">
					<input type="text" id="name" name="username" class="input input-mb" placeholder="Имя" autocomplete="username" required>
					<span class="text-warning">Не верное имя</span>
				</label>

				<label class="label">
					<input type="password" id="password" name="password" class="input" placeholder="Пароль" autocomplete="current-password" required>
					<span class="text-warning">Не верный пароль</span>
				</label>

				<p class="auth-status" role="alert" aria-live="assertive"></p>
				<button type="submit" class="button button-ui_firm"><span>Войти</span></button>
			</form>
		</section>
	</main>
	<script src="../dist/admin.js" defer></script>
</body>
</html>
